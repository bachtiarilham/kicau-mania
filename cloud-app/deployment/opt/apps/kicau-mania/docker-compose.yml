name: kicau-mania
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable GHCR digest}
    container_name: ${APP_CONTAINER:-kicau_mania_app}
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-./app.env}
    environment:
      HTTP_ADDR: 0.0.0.0:8091
      LOG_DIR: /app/logs
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /app/logs:size=16m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, wget, -q, -T, '3', -O, /dev/null, 'http://127.0.0.1:8091/readyz']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal_net, web_gateway]
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postgres:
    image: postgres:18-alpine
    container_name: ${DB_CONTAINER:-kicau_mania_db}
    restart: unless-stopped
    env_file: ./database.env
    volumes:
      - ./data/postgres18:/var/lib/postgresql
      - ./data/backups:/backups
    ports: ['127.0.0.1:${DB_BIND_PORT:-5432}:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal_net]
    logging: *logging
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal_net]
    logging: *logging
networks:
  internal_net:
    internal: true
  web_gateway:
    name: ${GATEWAY_NETWORK:-web_gateway}
    external: true
