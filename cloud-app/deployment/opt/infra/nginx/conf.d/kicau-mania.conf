server {
    listen 80;
    server_name dev-api.megaallstararena.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name dev-api.megaallstararena.com;
    ssl_certificate /etc/letsencrypt/live/dev-api.megaallstararena.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api.megaallstararena.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    limit_req_status 429;
    set $cloud_backend kicau_mania_app:8091;
    # Docker DNS is resolved at request time, including after container replacement.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    location ~ ^/api/v1/auth/(login|register|google(/link)?|forgot-password|reset-password|verify-email(/request)?|change-password)$ {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://$cloud_backend;
    }
    location / {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://$cloud_backend;
    }
}
