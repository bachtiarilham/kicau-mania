# Static frontend content lives under /opt/infra/www on the host.
server {
    listen 80;
    server_name megaallstararena.com www.megaallstararena.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name megaallstararena.com www.megaallstararena.com;
    ssl_certificate /etc/letsencrypt/live/megaallstararena.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/megaallstararena.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/www/main;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|map)$ { try_files $uri =404; }
}
server {
    listen 80;
    server_name dev.megaallstararena.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name dev.megaallstararena.com;
    ssl_certificate /etc/letsencrypt/live/dev.megaallstararena.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.megaallstararena.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $cloud_backend kicau_mania_app:8091;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    location ^~ /api/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_req zone=auth_sensitive burst=3 nodelay;
        proxy_pass http://$cloud_backend;
    }
    location = /healthz { proxy_pass http://$cloud_backend; }
    location = /readyz { proxy_pass http://$cloud_backend; }
    root /srv/www/dev;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|map)$ { try_files $uri =404; }
}
