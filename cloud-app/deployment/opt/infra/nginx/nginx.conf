user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log crit;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No query strings, referers, authorization or request bodies in access logs.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log safe;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;
    gzip on;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types application/json text/plain text/css application/javascript;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    map $uri $auth_rate_key {
        default '';
        ~^/api/v1/auth/(login|register|google(/link)?|forgot-password|reset-password|verify-email(/request)?|change-password)$ $binary_remote_addr;
    }
    # An empty key does not consume the authentication rate-limit budget.
    limit_req_zone $auth_rate_key zone=auth_sensitive:10m rate=5r/m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    include /etc/nginx/conf.d/*.conf;
}
