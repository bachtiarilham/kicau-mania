<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena lokal</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><header><strong>Arena lokal</strong><span id="connection">Memeriksa koneksi arena…</span><button id="logout" hidden>Keluar</button></header>
<main><section id="login"><h1>Penilaian arena</h1><p>Login dan nilai disimpan di server arena. Internet cloud tidak diperlukan setelah paket event tersedia.</p>
<label>Event<select id="events"></select></label><label>Username juri<input id="username" autocomplete="username"></label><label>Password khusus event<input id="password" type="password" autocomplete="current-password"></label><button id="sign-in">Masuk sebagai juri</button>
<details><summary>Operator arena</summary><label>Token operator<input id="operator-token" type="password" autocomplete="off"></label><button id="operator-login">Masuk sebagai operator</button></details></section>
<p id="message" role="status"></p><section id="workspace" hidden><div class="toolbar"><h1 id="event-name"></h1><button id="refresh">Muat ulang</button><button id="retry">Kirim antrean perangkat</button></div><p id="sync-state"></p>
<section id="operator-tools" hidden><h2>Persiapan event</h2><label>Event lokal<select id="event-switch"></select></label><label>ID event cloud<input id="cloud-event" autocomplete="off"></label><button id="pull">Unduh paket dari cloud</button><label>Paket event JSON (akun berisi hash password, bukan password cloud)<input id="bundle" type="file" accept="application/json,.json"></label><button id="import">Impor paket</button><button id="backup">Backup database</button><button id="history">Unduh riwayat revisi</button></section>
<section id="rounds"></section><section id="player" hidden><div class="toolbar"><h2 id="player-name">Live channel</h2><button id="stop-video">Tutup video</button></div><video id="video" controls autoplay muted playsinline></video><p id="video-state"></p></section>
</section></main><footer>Draft perangkat ≠ tersimpan di server arena. Gangguan media tidak menghentikan penilaian.</footer></body></html>
